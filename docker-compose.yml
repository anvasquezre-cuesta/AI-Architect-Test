services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network Qdrant is reachable by service name.
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # Provide your key in the shell or a .env file: OPENAI_API_KEY=sk-...
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LOG_LEVEL: INFO
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
