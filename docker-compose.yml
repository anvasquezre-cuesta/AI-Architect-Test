services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LOG_LEVEL: INFO
      # Set your key to enable LLM answers; without it the API degrades
      # gracefully to extractive answers built from retrieved context.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Optional fully-local, open-source LLM (no external API needed).
  # Start with: docker compose --profile local-llm up --build
  # then pull a model once: docker compose exec ollama ollama pull llama3.2
  # and point the API at it:
  #   OPENAI_BASE_URL=http://ollama:11434/v1  LLM_MODEL=llama3.2  OPENAI_API_KEY=ollama
  ollama:
    image: ollama/ollama:0.3.6
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_models:
